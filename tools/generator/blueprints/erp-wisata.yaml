module: ERP Wisata
entity: Destinasi
entities:
  - name: Destinasi
    label: Destinasi Wisata
  - name: PaketWisata
    label: Paket Wisata
  - name: Hotel
    label: Hotel
  - name: Kendaraan
    label: Kendaraan
  - name: Guide
    label: Pemandu Wisata
  - name: Reservasi
    label: Reservasi
  - name: Ticketing
    label: Ticketing
  - name: Pembayaran
    label: Pembayaran
  - name: Kas
    label: Kas
  - name: Jurnal
    label: Jurnal Akuntansi
description: Blueprint ERP Wisata untuk operasional destinasi, paket, hotel, kendaraan, guide, reservasi, ticketing, pembayaran, kas, jurnal, dan laporan.
fields:
  - name: id
    type: String
    required: true
    unique: true
    label: ID
    searchable: true
    filterable: true
    input: text
  - name: kode
    type: String
    required: true
    unique: true
    label: Kode
    searchable: true
    filterable: true
    input: text
  - name: nama
    type: String
    required: true
    unique: false
    label: Nama
    searchable: true
    filterable: true
    input: text
  - name: status
    type: String
    required: true
    unique: false
    default: '"aktif"'
    label: Status
    searchable: true
    filterable: true
    input: select
  - name: keterangan
    type: String
    required: false
    unique: false
    label: Keterangan
    searchable: false
    filterable: false
    input: textarea
relations:
  - name: pemesan
    target: Pelanggan
    kind: many-to-one
permissions:
  - key: wisata.read
    description: Baca data ERP Wisata.
  - key: wisata.write
    description: Kelola data ERP Wisata.
  - key: wisata.master
    description: Kelola master data wisata.
  - key: wisata.reservasi
    description: Kelola reservasi wisata.
  - key: wisata.keuangan
    description: Kelola keuangan wisata.
  - key: wisata.laporan
    description: Akses laporan wisata.
dashboard:
  widgets:
    - name: totalReservasi
      type: metric
      metric: count(id)
    - name: totalDestinasi
      type: metric
      metric: count(id)
    - name: totalPendapatan
      type: metric
      metric: sum(nominal)
reports:
  - name: wisata-operasional
    title: Laporan Operasional Wisata
    metrics:
      - status
      - nama
  - name: wisata-keuangan
    title: Laporan Keuangan Wisata
    metrics:
      - nominal
      - status
  - name: wisata-reservasi
    title: Laporan Reservasi Wisata
    metrics:
      - tanggal
      - status
menu:
  - label: ERP Wisata
    path: /erp-wisata
    icon: map
  - label: Master Data
    path: /erp-wisata/master
    icon: database
  - label: Transaksi
    path: /erp-wisata/transaksi
    icon: transaction
  - label: Keuangan
    path: /erp-wisata/keuangan
    icon: wallet
  - label: Laporan
    path: /erp-wisata/laporan
    icon: chart
mobile:
  screen: WisataHome
  offline: true
scanner:
  provider: wisata-ingestion
  schedule: 0 */4 * * *
metadata:
  domain: wisata
  owner: wisata-ops
